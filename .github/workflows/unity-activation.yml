name: 0. Get Unity Activation File

# One-time helper to obtain a Unity license activation file (.alf) WITHOUT a local
# Unity install. Run this manually, download the artifact, convert it to a .ulf at
# https://license.unity3d.com/manual, then paste the .ulf contents into the
# UNITY_LICENSE repository secret. See docs/ANDROID_BUILD.md.

on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request .alf
        id: getManualLicenseFile
        uses: game-ci/request-manual-activation-file@v2
        with:
          unityVersion: 2022.3.62f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
